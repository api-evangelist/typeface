generated: '2026-08-13'
method: searched
source: https://developers.typeface.ai/docs/introduction
docs:
  - https://developers.typeface.ai/docs/service-endpoints
  - https://developers.typeface.ai/docs/bearer-authentication
  - https://developers.typeface.ai/docs/errors
  - https://developers.typeface.ai/docs/troubleshooting
  - https://developers.typeface.ai/docs/api-rate-limits
authentication:
  style: Bearer JWT in Authorization header on every API except the token
    endpoint
  artifact: authentication/typeface-authentication.yml
endpoints:
  global_host: https://api-us.typeface.ai
  model: Global endpoint serves authentication and discovery (Get Access Token,
    Discover, Get Teams by OrgId); all other resources are reached through
    links returned in responses. Teams are provisioned per datacenter (Azure and
    GCP clouds); subsequent requests must use the datacenter hostname for the
    team.
hypermedia:
  style: HAL
  docs: https://developers.typeface.ai/docs/service-endpoints
  notes: Typeface APIs follow the HAL model so clients avoid hardcoding any
    endpoint except the well-known global APIs.
idempotency:
  documented: false
  notes: No idempotency-key header or replay contract is documented.
pagination:
  documented: false
  notes: List/search endpoints (Search Assets, Search Documents, Search Tags,
    Query Teams) accept filter parameters; no cross-cutting pagination
    convention is documented on a dedicated page.
async_jobs:
  pattern: Content generation is asynchronous - POST Generate Content returns a
    batch job; poll Poll Generation Job Status (batch-jobs/{monitorId}) and then
    fetch Get Generated Content.
error_envelope:
  shape: '{"errorMessage": "...", "status": "..."}'
  artifact: errors/typeface-problem-types.yml
request_tracing:
  header: request-id
  direction: both
  notes: >-
    Every API response carries a request-id header (example value
    "36452f1b-4b1e99a0af036211.36452f1c_"); clients may also supply their own
    Request-Id header on the request. Typeface support asks for this value on
    every case.
  docs: https://developers.typeface.ai/docs/troubleshooting
  artifact: rate-limits/typeface-rate-limits.yml
rate_limiting:
  signaling: HTTP 429 Too Many Requests on throttling
  documented_headers: none
  scope: per API application (not per user)
  published_limits: 3000 requests / 5 minutes on general and create-asset
    endpoints; 30 text-to-image requests / 15 minutes; max 10 sub-requests per
    content-generation batch (an 11th is rejected as 100/bad request)
  docs: https://developers.typeface.ai/docs/api-rate-limits
  artifact: rate-limits/typeface-rate-limits.yml
versioning:
  documented: false
webhooks:
  artifact: asyncapi/typeface-webhooks.yml
