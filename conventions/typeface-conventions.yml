endpoints:
  global_host: https://api-us.typeface.ai
  model: Global endpoint serves authentication and discovery (Get Access Token,
    Discover, Get Teams by OrgId); all other resources are reached through
    links returned in responses. Teams are provisioned per datacenter (Azure and
    GCP clouds); subsequent requests must use the datacenter hostname for the
    team.
hypermedia:
  style: HAL
  docs: https://developers.typeface.ai/docs/service-endpoints
  notes: Typeface APIs follow the HAL model so clients avoid hardcoding any
    endpoint except the well-known global APIs.
