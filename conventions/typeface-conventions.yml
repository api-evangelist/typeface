    Query Teams) accept filter parameters; no cross-cutting pagination
    convention is documented on a dedicated page.
async_jobs:
  pattern: Content generation is asynchronous - POST Generate Content returns a
    batch job; poll Poll Generation Job Status (batch-jobs/{monitorId}) and then
    fetch Get Generated Content.
