  - id: a2a
    conforms: partial
    evidence: 'Typeface documents an A2A agent that lets Gemini Enterprise
      exercise Typeface capabilities
      (https://developers.typeface.ai/docs/introduction), but no A2A Agent Card
      is served: /.well-known/agent-card.json and /.well-known/agent.json
      returned 404 on www.typeface.ai, developers.typeface.ai and
      app.typeface.ai and 401 on api-us.typeface.ai (probed 2026-08-13). The
      A2A surface is therefore undiscoverable to an agent that has not been
      onboarded through Gemini Enterprise.'
