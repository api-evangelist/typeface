              $ref: '#/components/schemas/CreateAssetV2RequestBody'
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EntityModelAssetV2'
      summary: Create Asset
  /profile-service/accounts/{accountId}/asset-catalogs/{assetCatalogId}/assets/{assetId}:
    delete:
