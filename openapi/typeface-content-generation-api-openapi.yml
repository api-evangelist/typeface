  /batch-service/accounts/{accountId}/projects/{projectId}/batch-jobs/{monitorId}:
    get:
      summary: Poll Generation Job Status
      description: "**Sample Response**\n\nBased on how many requests batched in the Generation API call, those many `jobStepResponses` will be returned.\n\nEach one contains `documentMetadata` object with an `id`. This document corresponds to the response for each of the request in the batch. Use `documentMetadata.id` as `documentId` while making subsequent call to fetch the generated content.\n\n```json\n{\n    \"job\": {\n        \"jobId\": \"2bd1365a-ac4b-4224-bf97-dd0c4a8c91e9\",\n        \"name\": \"Generate First Image\",\n        \"projectId\": \"243056\",\n        \"status\": \"SUCCEEDED\",\n        \"createdAt\": \"2024-03-28T20:47:32+05:30\",\n        \"startedAt\": \"2024-03-28T20:47:32+05:30\",\n        \"completedAt\": \"2024-03-28T20:48:26+05:30\",\n        \"jobStepResponses\": [\n            {\n                \"status\": \"SUCCEEDED\",\n                \"documentMetadata\": {\n                    \"id\": 46,\n                    \"name\": \"simple_image_0\"\n                }\n            }\n        ]\n    },\n    \"links\": [\n        {\n            \"rel\": \"self\",\n            \"href\": \"https://api-us.typeface.ai/batch-service/accounts/5d903776-016a-4f1d-814d-71d44a88ebd3/projects/243056/batch-jobs/2bd1365a-ac4b-4224-bf97-dd0c4a8c91e9\"\n        }\n    ]\n}\n```"
      tags:
      - Content Generation
      parameters:
      - name: accountId
        in: path
        required: true
        description: Unique identifier for the specific team
        schema:
          type: string
      - name: projectId
        in: path
        required: true
        description: Unique identifier for the specific project
        schema:
          type: string
      - name: monitorId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  job:
                    type: object
                    properties:
                      jobId:
                        type: string
                      name:
                        type: string
                      jobStepResponses:
                        type: array
                        items:
                          type: object
                          properties:
                            status:
                              type: string
                            documentMetadata:
                              type: object
                              properties:
                                id:
                                  type: string
                                name:
                                  type: string
  /content-service/workspace/{projectId}/documents/{documentId}/read-only:
    get:
      tags:
      - Content Generation
      operationId: getReadOnlyDocument
      parameters:
      - name: projectId
        in: path
        required: true
        description: Unique identifier for the specific project
        schema:
          type: integer
          format: int64
      - name: documentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/vnd.typeface.documents.blocks.v2+json:
              schema:
                $ref: '#/components/schemas/GetReadOnlyDocumentResponseBody'
      summary: Get Generated Content
      description: Retrieve generated content using this API. Response contains array of blocks and each block corresponds to a content fragment. For simple text and image, there will be only one block. Each block has `type` which indicates the content type and `variations` generated.
components:
  schemas:
    ReadOnlyDocument:
      type: object
      properties:
        workspaceId:
          $ref: '#/components/schemas/WorkspaceId'
        id:
          $ref: '#/components/schemas/EntityId'
        name:
          type: string
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/ContentBlock'
        signedUrlResponses:
          type: array
          items:
            $ref: '#/components/schemas/SignedUrlResponse'
        additionalProperties:
          type: object
          additionalProperties:
            type: object
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
        createdBy:
          type: string
        modifiedBy:
          type: string
    WorkspaceId:
      type: object
      properties:
        id:
          type: integer
          format: int64
    BlobId:
      type: object
      properties:
        id:
          type: integer
          format: int64
    GetReadOnlyDocumentResponseBody:
      type: object
      properties:
        document:
          $ref: '#/components/schemas/ReadOnlyDocument'
        documentBlocks:
          $ref: '#/components/schemas/UIDocumentBlocksFormat'
        documentBlocksV2:
          $ref: '#/components/schemas/UIDocumentBlocksFormatV2'
    ContentBlockV2TextContent:
      type: object
      allOf:
      - $ref: '#/components/schemas/IContentBlockV2BaseContent'
      - type: object
        properties:
          content:
            type: string
    Context:
      type: object
      properties:
        additionalPrompts:
          type: array
          items:
            type: string
    ContentBlock:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - Image
          - Text
          - Video
        ref:
          $ref: '#/components/schemas/EntityRef'
        promptId:
          type: string
        styleElements:
          type: object
          additionalProperties:
            type: object
        blockDefinition:
          $ref: '#/components/schemas/BlockDefinition'
        content:
          type: string
        inputPrompt:
          type: string
          deprecated: true
        usage:
          type: string
    UIDocumentBlocksFormat:
      type: object
      properties:
        version:
          type: string
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/UIContentBlock'
        metadata:
          $ref: '#/components/schemas/DocMetadata'
    ContentBlockV2ImageContent:
      type: object
      allOf:
      - $ref: '#/components/schemas/IContentBlockV2BaseContent'
      - type: object
        properties:
          imageUrl:
            type: string
          width:
            type: integer
            format: int64
          height:
            type: integer
            format: int64
    UIContentBlock:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - List
          - Title
          - Image
          - Text
        promptId:
          type: string
        styles:
          type: object
          additionalProperties:
            type: object
        data:
          type: object
          additionalProperties:
            type: object
    EntityId:
      type: object
      properties:
        id:
          type: integer
          format: int64
    BlockDefinition:
      type: object
      properties:
        ordinal:
          type: integer
          format: int32
        blockName:
          type: string
        blockType:
          type: string
          enum:
          - Image
          - Text
          - Video
        properties:
          type: object
          additionalProperties:
            type: object
        promptCorpus:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        context:
          $ref: '#/components/schemas/Context'
    SignedUrlResponse:
      type: object
      properties:
        blobId:
          $ref: '#/components/schemas/BlobId'
        signedUrl:
          type: string
    IContentBlockV2BaseContent:
      required:
      - type
      type: object
      properties:
        type:
          type: string
      discriminator:
        propertyName: type
    UIContentBlockV2:
      type: object
      properties:
        type:
          type: string
          enum:
          - Image
          - Text
          - Video
        variations:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/ContentBlockV2ImageContent'
            - $ref: '#/components/schemas/ContentBlockV2TextContent'
    EntityRef:
      type: object
      properties:
        workspaceId:
          $ref: '#/components/schemas/WorkspaceId'
        entityId:
          $ref: '#/components/schemas/EntityId'
        entityType:
          type: string
        additionalProperties:
          type: object
          additionalProperties:
            type: object
    DocMetadata:
      type: object
      properties:
        documentId:
          type: string
        documentName:
          type: string
        projectId:
          type: string
    UIDocumentBlocksFormatV2:
      type: object
      properties:
