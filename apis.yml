aid: typeface
name: Typeface
description: 'Typeface is an enterprise marketing AI platform that orchestrates
  AI agents, brand intelligence, and workflows to create personalized, on-brand
  campaigns at scale. Its developer platform exposes REST APIs (bearer JWT via
  application credentials) for identity discovery, teams, projects, brand kits,
  audiences, layouts, assets, tags, content workflows, document search, and
  asynchronous batch content generation, plus outbound/inbound webhooks, a
  hosted MCP server with OAuth 2.1, an A2A agent surface, SCIM 2.0
  provisioning, and 30+ marketing-stack connectors.'
