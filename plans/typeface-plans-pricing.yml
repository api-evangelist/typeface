notes: >-
  Typeface publishes no public pricing or plan page. Probed 2026-08-13:
  https://www.typeface.ai/pricing returned 404 and https://www.typeface.ai/plans
  returned 404; the marketing site routes every commercial path to "Book a demo"
  / "Contact sales". The developer docs confirm the commercial posture from the
  other direction - the rate-limit page
  (https://developers.typeface.ai/docs/api-rate-limits) tells developers to
  "reach out to your Account Executive or Customer Success Manager" for higher
  limits rather than naming a tier or an overage price. No machine-readable
  pricing or catalog endpoint is published, and API access is gated behind an
  Organization Administrator creating an Application in the product UI, so there
  is no published self-serve price for the API itself.
