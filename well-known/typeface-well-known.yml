notes: >-
  Re-probed 2026-08-13. Two real documents are served: the RFC 8414 OAuth
  authorization-server metadata and the RFC 9728 OAuth protected-resource
  metadata, both on api-us.typeface.ai - together they are the discovery
  surface for the Typeface MCP OAuth 2.1 flow (issuer
  https://api-us.typeface.ai, PKCE S256, scopes openid/email/profile/
  offline_access, jwks at auth-us.typeface.ai). No security.txt is served on any
  host (401 behind the API gateway, 404 on the marketing and docs hosts), so no
  SecurityTxt pointer is emitted. No A2A agent card was found at either the
  canonical or legacy well-known path on any host, so no AgentCard artifact was
  written - even though the docs
  (https://developers.typeface.ai/docs/introduction) describe a "Typeface A2A
  Agent" for Gemini Enterprise.
